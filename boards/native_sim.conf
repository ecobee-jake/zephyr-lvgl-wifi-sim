CONFIG_LV_COLOR_DEPTH_32=y
CONFIG_LV_Z_MEM_POOL_SIZE=81920

# Step 3: headroom for wpa_supplicant + nl80211 driver
CONFIG_HEAP_MEM_POOL_SIZE=65535

CONFIG_ETH_NATIVE_TAP=n

# The Wi-Fi interface only comes up after a connect, so disable net_config's
# "need address" waits: otherwise net_config blocks for up to
# CONFIG_NET_CONFIG_INIT_TIMEOUT (30s) at boot and logs a spurious failure.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_NEED_IPV6=n