# Wi-Fi manifest: jukkar's fork, which carries the native_sim Wi-Fi driver
# (PR #110681) that upstream does not have yet. hostap is the supplicant.
#
# Select with: ./scripts/switch-zephyr.sh wifi   (see west-base.yml for the other)
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      url: https://github.com/jukkar/zephyr
      revision: devel/wifi-driver-for-native_sim
      import:
        name-allowlist: [lvgl, mbedtls, tf-psa-crypto, hostap, picolibc]


  self:
    path: lvgl-demo