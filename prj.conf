CONFIG_MAIN_STACK_SIZE=6144
CONFIG_LOG=y

CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# src/diag/heap-monitor.c: max_allocated_bytes / free_bytes are only tracked
# when the heap gathers runtime stats. ARRAY_SIZE makes every sys_heap register
# itself from sys_heap_init(), which is the only way to reach the kernel system
# heap and the libc arena - neither exposes its sys_heap. The monitor warns if
# this is too small, since the overflow is otherwise silent.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=8

CONFIG_DISPLAY=y
CONFIG_INPUT=y

CONFIG_LV_FONT_MONTSERRAT_14=y

# No networking here on purpose: this is the base build, and it must compile
# against plain upstream Zephyr. Wi-Fi Kconfigs live in overlays/wifi.conf and
# are opted into alongside one of the overlays - see readme.md.
