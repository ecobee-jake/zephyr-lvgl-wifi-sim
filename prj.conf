CONFIG_MAIN_STACK_SIZE=6144
CONFIG_LOG=y

CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384

CONFIG_DISPLAY=y
CONFIG_INPUT=y

CONFIG_LV_FONT_MONTSERRAT_14=y



# Networking
CONFIG_NETWORKING=y

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# Connect + upstream proof: DHCP lease from the AP's dnsmasq, then an ICMP echo
# out through the host NAT (see scripts/bring-up-dev-iface.sh).
# ICMPv4 has no Kconfig of its own - it is built in with NET_IPV4.
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# # native_sim's board defconfig defaults this to y whenever CONFIG_WIFI=y (to
# # support jukkar's native_sim WiFi driver by default), but our fake driver
# # answers scan requests itself via wifi_mgmt_ops - no supplicant needed.
# CONFIG_WIFI_NM_WPA_SUPPLICANT=n

# --- Step 3: PR #110681 native_sim WiFi driver app config ---
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Added in attempt to fix long boot hang
CONFIG_NET_CONFIG_AUTO_INIT=n