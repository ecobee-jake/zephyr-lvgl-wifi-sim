# Everything the Wi-Fi path needs, shared by both Wi-Fi overlays: the dev (hwsim)
# and real-card builds differ only in devicetree, not in Kconfig.
#
# Requires the fork: ./scripts/switch-zephyr.sh wifi
# Always paired with an overlay, never used alone:
#   -DEXTRA_CONF_FILE=overlays/wifi.conf -DEXTRA_DTC_OVERLAY_FILE=overlays/dev-iface.overlay

CONFIG_NETWORKING=y

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# Connect + upstream proof: DHCP lease from the AP's dnsmasq, then an ICMP echo
# out through the host NAT (see scripts/bring-up-dev-iface.sh).
# ICMPv4 has no Kconfig of its own - it is built in with NET_IPV4.
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# From PR #110681's own app config.
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# CONFIG_NET_CONFIG_SETTINGS is deliberately left off. Its SYS_INIT waits up to
# CONFIG_NET_CONFIG_INIT_TIMEOUT (30s) for the interface to come up, before
# application threads start, and nothing brings the Wi-Fi interface up at boot any
# more - connect happens on a press in the scan list. That was a dead 30s hang.
# We drive DHCP ourselves from src/net/wifi-sta.c, so net_config buys us nothing.
# (Setting NET_CONFIG_NEED_IPV4/IPV6=n does NOT avoid the wait - the first loop in
# subsys/net/lib/config/init.c ignores those flags. Turning the whole thing off is
# what works.)

# Headroom for wpa_supplicant + the nl80211 driver.
CONFIG_HEAP_MEM_POOL_SIZE=65535

# native_sim's defconfig turns the TAP ethernet driver on with NETWORKING; we
# only want the Wi-Fi interface.
CONFIG_ETH_NATIVE_TAP=n
